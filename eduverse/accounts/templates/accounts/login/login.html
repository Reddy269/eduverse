
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Eduverse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&family=Unbounded:wght@600&display=swap">
  <link rel="stylesheet" href="{% static 'css/loginstyle.css' %}">
</head>
<body>
  <main class="hero hero--form">
    <div class="hero__content">
      <h1 class="hero__title hero__title--sm">Log in to Eduverse</h1>

      <form id="login-form" class="auth-form" method="post" action="" novalidate>
        {% csrf_token %}

        <div class="auth-form__field">
          <label for="usertype">I am a</label>
          <select id="usertype" name="usertype">
            <option value="student"
                    data-register="{% url 'accounts:register' usertype='student' %}"
                    data-label="a student" selected>Student</option>
            <option value="instructor"
                    data-register="{% url 'accounts:register' usertype='instructor' %}"
                    data-label="an instructor">Instructor</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="auth-form__field">
          <label for="username">Username or Email</label>
          <input id="username" name="username" type="text" autocomplete="username">
        </div>

        <div class="auth-form__field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
        </div>

        <button class="auth-form__submit" type="submit">Log in</button>

        <p class="auth-form__alt" id="register-row">
          New here?
          <a id="register-link" href="{% url 'accounts:register' usertype='student' %}">Register as a student</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Popup -->
  <div id="popup" class="popup" role="alertdialog" aria-modal="true"
       aria-labelledby="popup-message"
       data-server-error="{% if error %}{{ error }}{% endif %}" hidden>
    <div class="popup__box">
      <button type="button" class="popup__close" id="popup-close" aria-label="Close">&times;</button>
      <p class="popup__message" id="popup-message"></p>
    </div>
  </div>

  <script>
    var REGISTER = {
      student: {
        url: "{% url 'accounts:register' usertype='student' %}",
        text: "Register as a student"
      },
      instructor: {
        url: "{% url 'accounts:register' usertype='instructor' %}",
        text: "Register as an instructor"
      }
    };

    var select = document.getElementById("usertype");
    var row = document.getElementById("register-row");
    var link = document.getElementById("register-link");

    function updateRegister() {
      var info = REGISTER[select.value];
      if (!info) {              // admin
        row.style.display = "none";
        return;
      }
      row.style.display = "";
      link.href = info.url;
      link.textContent = info.text;
    }

    select.addEventListener("change", updateRegister);
    updateRegister();

    // ---- Popup ----
    var popup = document.getElementById("popup");
    var popupMsg = document.getElementById("popup-message");

    function showPopup(message) {
      popupMsg.textContent = message;
      popup.hidden = false;
    }

    function hidePopup() {
      popup.hidden = true;
    }

    document.getElementById("popup-close").addEventListener("click", hidePopup);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") hidePopup();
    });
    popup.addEventListener("click", function (e) {
      if (e.target === popup) hidePopup();
    });

    // show the server-side error from Django, if any
    var serverError = popup.dataset.serverError;
    if (serverError) showPopup(serverError);
  </script>
</body>
</html>
