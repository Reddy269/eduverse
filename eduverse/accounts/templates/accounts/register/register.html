<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · Eduverse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&family=Unbounded:wght@600&display=swap">
  <link rel="stylesheet" href="{% static 'css/loginstyle.css' %}">
</head>
<body>
  <main class="hero hero--form">
    <div class="hero__content">
      <h1 class="hero__title hero__title--sm">Register as {{ role_label|default:"a student" }}</h1>

      {% if step == "details" %}

      <!-- Step 2: full form, email prefilled by the backend -->
      <form id="register-form" class="auth-form" method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="step" value="details">
        <input type="hidden" name="role" value="{{ role|default:'student' }}">

        <div class="auth-form__field">
          <label for="email">Email</label>
          <input id="email" name="email" type="text" autocomplete="email" value="{{ email }}">
        </div>

        <div class="auth-form__field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" value="{{ name }}">
        </div>

        <div class="auth-form__field">
          <label for="dob">Date of birth</label>
          <input id="dob" name="dob" type="date" autocomplete="bday" value="{{ dob }}">
        </div>

        <div class="auth-form__field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" value="{{ username }}">
        </div>

        <div class="auth-form__field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password">
        </div>

        <div class="auth-form__field">
          <label for="confirm_password">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password">
        </div>

        <button class="auth-form__submit" type="submit">Create account</button>

        <p class="auth-form__alt">
          Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
        </p>
      </form>

      {% else %}

      <!-- Step 1: email only -->
      <form id="register-form" class="auth-form" method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="step" value="email">
        <input type="hidden" name="role" value="{{ role|default:'student' }}">

        <div class="auth-form__field">
          <label for="email">Email</label>
          <input id="email" name="email" type="text" autocomplete="email" value="{{ email }}">
        </div>

        <button class="auth-form__submit" type="submit">Continue</button>

        <p class="auth-form__alt">
          Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
        </p>
      </form>

      {% endif %}
    </div>
  </main>

  <!-- Popup -->
  <div id="popup" class="popup" role="alertdialog" aria-modal="true"
       aria-labelledby="popup-message"
       data-server-error="{% if error %}{{ error }}{% endif %}" hidden>
    <div class="popup__box">
      <button type="button" class="popup__close" id="popup-close" aria-label="Close">&times;</button>
      <p class="popup__message" id="popup-message"></p>
    </div>
  </div>

  <script>
    var popup = document.getElementById("popup");
    var popupMsg = document.getElementById("popup-message");

    function showPopup(message) {
      popupMsg.textContent = message;
      popup.hidden = false;
    }

    function hidePopup() {
      popup.hidden = true;
    }

    document.getElementById("popup-close").addEventListener("click", hidePopup);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") hidePopup();
    });
    popup.addEventListener("click", function (e) {
      if (e.target === popup) hidePopup();
    });

    // show the server-side error from Django, if any
    var serverError = popup.dataset.serverError;
    if (serverError) showPopup(serverError);
  </script>
</body>
</html>
