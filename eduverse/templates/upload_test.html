<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload files</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#c9cfdb; --accent:#2457d6; --ok:#157347; --err:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171f; --card:#1d222d; --text:#e8ebf2; --muted:#98a2b3; --line:#3a4254; --accent:#6d93f5; --ok:#4ade80; --err:#f97066; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { width:100%; max-width:480px; background:var(--card); border-radius:12px; padding:24px; }
  h1 { font-size:1.25rem; margin:0 0 16px; }
  #drop { display:block; border:2px dashed var(--line); border-radius:10px; padding:36px 16px;
          text-align:center; color:var(--muted); cursor:pointer; }
  #drop.over, #drop:focus-within { border-color:var(--accent); color:var(--text); }
  #drop input { position:absolute; opacity:0; width:1px; height:1px; }
  ul { list-style:none; padding:0; margin:16px 0 0; }
  li { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); font-size:.9rem; }
  li span:last-child { color:var(--muted); white-space:nowrap; }
  progress { width:100%; height:8px; margin-top:16px; display:none; }
  button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:8px;
           background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible { outline:3px solid var(--text); outline-offset:2px; }
  #status { margin:12px 0 0; min-height:1.5em; font-size:.9rem; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Upload files</h1>

  <label id="drop">
    <input type="file" id="picker" multiple accept=".pdf,.mp4">
    Drop files here or click to choose<br><small>PDF or MP4</small>
  </label>

  <ul id="list"></ul>
  <progress id="bar" max="100" value="0"></progress>
  <button id="send" disabled>Upload</button>
  <p id="status" role="status"></p>
</main>

<script>
  const drop = document.getElementById('drop');
  const picker = document.getElementById('picker');
  const list = document.getElementById('list');
  const bar = document.getElementById('bar');
  const send = document.getElementById('send');
  const status = document.getElementById('status');
  let files = [];

  function csrfToken() {
    const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function size(n) {
    return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  }

  function setFiles(fl) {
    files = Array.from(fl);
    list.innerHTML = '';
    files.forEach(f => {
      const li = document.createElement('li');
      li.innerHTML = '<span></span><span></span>';
      li.children[0].textContent = f.name;
      li.children[1].textContent = size(f.size);
      list.appendChild(li);
    });
    send.disabled = files.length === 0;
    status.textContent = ''; status.className = '';
  }

  picker.addEventListener('change', () => setFiles(picker.files));

  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove('over');
  }));
  drop.addEventListener('drop', e => setFiles(e.dataTransfer.files));

  send.addEventListener('click', () => {
    const fd = new FormData();
    files.forEach(f => fd.append('file', f));       // key "file" -> request.FILES["file"]

    const xhr = new XMLHttpRequest();
    xhr.open('POST', window.location.href);         // current URL
    xhr.setRequestHeader('X-CSRFToken', csrfToken());

    xhr.upload.onprogress = e => {
      if (e.lengthComputable) bar.value = (e.loaded / e.total) * 100;
    };
    xhr.onload = () => {
      const ok = xhr.status >= 200 && xhr.status < 300;
      status.textContent = ok ? 'Upload complete.' : 'Upload failed (HTTP ' + xhr.status + ').';
      status.className = ok ? 'ok' : 'err';
      send.disabled = false;
    };
    xhr.onerror = () => {
      status.textContent = 'Network error. The upload did not finish.';
      status.className = 'err';
      send.disabled = false;
    };

    bar.value = 0; bar.style.display = 'block';
    send.disabled = true;
    status.textContent = 'Uploading...'; status.className = '';
    xhr.send(fd);                                   // browser sets Content-Type + boundary
  });
</script>
</body>
</html>
