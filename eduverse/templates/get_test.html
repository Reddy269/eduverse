<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ content.name }}</title>
<style>
  :root { --bg:#e9ecf1; --bar:#fff; --text:#1d2330; --line:#c9cfdb; --accent:#2457d6; --err:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --bar:#1d222d; --text:#e8ebf2; --line:#3a4254; --accent:#6d93f5; --err:#f97066; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:1; display:flex; flex-wrap:wrap; align-items:center;
           gap:8px 20px; padding:12px 20px; background:var(--bar); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:1.1rem; flex:1 1 200px; }
  #count { color:var(--text); opacity:.7; font-size:.9rem; }
  a { color:var(--accent); }
  #pages { max-width:900px; margin:20px auto; padding:0 12px; }
  canvas { display:block; width:100%; margin:0 0 16px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #msg { max-width:900px; margin:20px auto; padding:0 12px; }
  #msg.err { color:var(--err); }
</style>
</head>
<body>
  <header>
    <h1>{{ content.name }}</h1>
    <span id="count"></span>
    <a href="{{ content.file.url }}" target="_blank" rel="noopener">Open in new tab</a>
    <a href="{{ content.file.url }}" download>Download</a>
  </header>

  <p id="msg">Loading PDF...</p>
  <main id="pages" aria-label="PDF pages"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const url = "{{ content.file.url|escapejs }}";
    const pages = document.getElementById('pages');
    const msg = document.getElementById('msg');

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    async function show() {
      try {
        const pdf = await pdfjsLib.getDocument(url).promise;   // fetches the file, same origin
        document.getElementById('count').textContent = pdf.numPages + (pdf.numPages === 1 ? ' page' : ' pages');
        msg.style.display = 'none';

        const cssWidth = pages.clientWidth;
        const dpr = window.devicePixelRatio || 1;

        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          const fit = cssWidth / page.getViewport({ scale: 1 }).width;
          const vp = page.getViewport({ scale: fit * dpr });

          const canvas = document.createElement('canvas');
          canvas.width = vp.width;
          canvas.height = vp.height;
          canvas.setAttribute('aria-label', 'Page ' + n);
          pages.appendChild(canvas);

          await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        }
      } catch (e) {
        msg.className = 'err';
        msg.style.display = 'block';
        msg.textContent = 'Could not load the PDF (' + e.message + '). Use "Open in new tab" instead.';
      }
    }
    show();
  </script>
</body>
</html>
